[project]
name = "vulnpairs"
version = "0.1.0"
description = "Per-family patch-pair vulnerability study on MegaVul"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["model"]

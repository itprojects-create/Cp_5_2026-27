name: Release & Testing Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # Manual trigger option

permissions:
  contents: write

jobs:
  # Job 1: Run Tests
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest with coverage
        run: |
          pytest --cov=. --cov-report=xml --cov-report=html -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  # Job 2: Code Quality & Linting
  lint:
    name: Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black pylint

      - name: Check code formatting with Black
        run: black --check . || echo "⚠️  Black formatting issues found (run 'black .' to fix)"
        continue-on-error: true

      - name: Run Flake8 linting
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        continue-on-error: true

  # Job 3: Version, Tag & Release (main branch only, after tests + lint pass)
  release:
    name: Version, Tag & Release
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── Derive next version by bumping the patch of the latest vX.Y.Z tag ──
      - name: Compute next version
        id: version
        run: |
          set -euo pipefail

          # Find the latest semver tag (vX.Y.Z). Default to v0.0.0 if none exist.
          LATEST=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' \
                   | sort -V | tail -n 1 || true)
          LATEST="${LATEST:-v0.0.0}"

          # Strip the 'v' prefix and split into parts.
          VER="${LATEST#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VER"

          # Bump the patch component.
          PATCH=$(( PATCH + 1 ))
          NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"

          echo "latest_tag=$LATEST" >> "$GITHUB_OUTPUT"
          echo "new_tag=$NEW_TAG"   >> "$GITHUB_OUTPUT"

          echo "Latest tag : $LATEST"
          echo "Next tag   : $NEW_TAG"

      # ── Package a source archive (avoids setuptools flat-layout ambiguity ──
      # ── from the mixed paper/datasets/code top-level dirs)                 ──
      - name: Package source archive
        run: |
          mkdir -p release-output
          git archive --format=tar.gz \
            -o "release-output/CryptoHGNN-${{ steps.version.outputs.new_tag }}.tar.gz" HEAD

      # ── Tag & GitHub Release ───────────────────────────────────────────────
      - name: Create git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.version.outputs.new_tag }}
          git push origin ${{ steps.version.outputs.new_tag }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.new_tag }}
          name: ${{ steps.version.outputs.new_tag }}
          body: "Release ${{ steps.version.outputs.new_tag }}"
          draft: false
          prerelease: false
          files: release-output/CryptoHGNN-${{ steps.version.outputs.new_tag }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Job 4: Deployment Status Check
  status:
    name: Workflow Status Check
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: always()

    steps:
      - name: Check workflow status
        run: |
          if [ "${{ needs.test.result }}" = "failure" ] || [ "${{ needs.lint.result }}" = "failure" ]; then
            echo "❌ Workflow failed - Please fix the issues above"
            exit 1
          fi
          echo "✅ All checks passed!"

[project]
name = "cryptohgnn"
version = "0.1.0"
description = "CryptoFlow: Robust Cryptographic Misuse Detection & Agentic Remediation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "torch>=2.2.0",
    "torch-geometric>=2.5.0",
    "tree-sitter>=0.22.0",
    "tree-sitter-c>=0.21.0",
    "tree-sitter-rust>=0.21.0",
    "plotly>=5.20.0",
    "matplotlib>=3.8.0",
    "kaleido>=0.2.1",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
    "networkx>=3.3",
    "PyYAML>=6.0.1",
    "anthropic>=0.25.0",
    "python-dotenv>=1.0.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "tqdm>=4.66.0",
    "psutil>=5.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
